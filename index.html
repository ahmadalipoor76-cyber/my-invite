<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>یک پیشنهاد خاص ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #ffebee;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            text-align: center;
        }

        /* کادر اصلی */

        .container {
            width: 90%;
            max-width: 430px;
            min-height: 240px;

            background: white;

            padding: 30px 20px;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);

            position: relative;

            z-index: 10;
        }


        /* مراحل */

        .step {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }


        /* عنوان */

        h1 {
            margin: 0 0 25px;

            color: #d81b60;

            font-size: 23px;

            line-height: 1.8;
        }


        /* دکمه‌ها */

        .btn {
            border: none;

            border-radius: 50px;

            padding: 12px 24px;

            margin: 7px;

            font-family: Tahoma, Arial, sans-serif;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease;
        }


        .yes {
            background: #4caf50;

            color: white;
        }


        .yes:hover {
            transform: scale(1.05);
        }


        /* محدوده دکمه‌ها */

        .buttons-area {
            position: relative;

            width: 100%;

            height: 100px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* دکمه نه */

        .no {
            background: #f44336;

            color: white;

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(75px, -50%);

            /*
             * حرکت بسیار سریع
             */

            transition:
                left 0.08s linear,
                top 0.08s linear;
        }


        /* انیمیشن مراحل */

        .fade-in {
            animation:
                fadeIn 0.5s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* نتیجه */

        .result {
            margin-top: 10px;

            color: #555;

            font-size: 17px;

            line-height: 2.4;
        }


        .result strong {
            color: #d81b60;
        }


        .final-text {
            margin-top: 20px;

            color: #d81b60;

            font-size: 18px;

            font-weight: bold;
        }


        /* قلب */

        .heart {
            position: fixed;

            top: -50px;

            pointer-events: none;

            user-select: none;

            z-index: 5;

            animation-name:
                heartFall;

            animation-timing-function:
                linear;

            animation-fill-mode:
                forwards;
        }


        @keyframes heartFall {

            from {

                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 1;
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* موبایل */

        @media (max-width: 500px) {

            .container {
                width: 92%;

                padding:
                    25px 15px;
            }


            h1 {
                font-size: 20px;
            }


            .btn {
                font-size: 14px;

                padding:
                    11px 18px;
            }

        }

    </style>

</head>


<body>


    <!-- آهنگ -->

    <audio id="myAudio" loop>

        <source
            src="my-song.mp3"
            type="audio/mpeg">

    </audio>



    <!-- کادر اصلی -->

    <div class="container">


        <!-- مرحله اول -->

        <div
            id="step0"
            class="step">

            <h1>
                با من میایی بیرون؟ 😊
            </h1>


            <div class="buttons-area">


                <button
                    class="btn yes"
                    onclick="goToStep(1)">

                    آره!

                </button>


                <button
                    class="btn no"
                    id="noBtn">

                    نه!

                </button>


            </div>

        </div>



        <!-- مرحله دوم -->

        <div
            id="step1"
            class="step hidden">

            <h1>
                چه زمانی بهتره؟ ⏰
            </h1>


            <button
                class="btn yes"
                onclick="chooseTime('فردا عصر')">

                فردا عصر

            </button>


            <button
                class="btn yes"
                onclick="chooseTime('آخر هفته')">

                آخر هفته

            </button>


            <button
                class="btn yes"
                onclick="chooseTime('این هفته هر وقت مامان اجازه داد')">

                این هفته هر وقت مامان اجازه داد

            </button>

        </div>



        <!-- مرحله سوم -->

        <div
            id="step2"
            class="step hidden">

            <h1>
                چی بخوریم؟ 🍕
            </h1>


            <button
                class="btn yes"
                onclick="chooseFood('پیتزا و فست فود')">

                پیتزا و فست فود

            </button>


            <button
                class="btn yes"
                onclick="chooseFood('غذای ایرانی')">

                ایرانی

            </button>


            <button
                class="btn yes"
                onclick="chooseFood('بستنی')">

                بستنی

            </button>


            <button
                class="btn yes"
                onclick="chooseFood('قهوه')">

                قهوه

            </button>

        </div>



        <!-- مرحله نهایی -->

        <div
            id="step3"
            class="step hidden">

            <h1>
                عالیه! ❤️
            </h1>


            <div class="result">

                <div>

                    ⏰ زمان انتخاب‌شده:

                    <strong
                        id="selectedTime">
                    </strong>

                </div>


                <div>

                    🍕 انتخاب شما:

                    <strong
                        id="selectedFood">
                    </strong>

                </div>

            </div>


            <div class="final-text">

                منتظرت هستم ❤️

            </div>

        </div>


    </div>



    <script>


        /* ==========================
           متغیرها
        ========================== */


        const audio =
            document.getElementById("myAudio");


        const noBtn =
            document.getElementById("noBtn");


        const buttonsArea =
            document.querySelector(".buttons-area");


        let selectedTime = "";

        let selectedFood = "";

        let heartsStarted = false;



        /* ==========================
           آهنگ
        ========================== */

        document.addEventListener(
            "click",
            function () {

                audio
                    .play()
                    .catch(function () {});

            },
            {
                once: true
            }
        );



        /* ==========================
           حرکت خیلی سریع نه
        ========================== */

        function moveNo() {


            const areaWidth =
                buttonsArea.clientWidth;


            const areaHeight =
                buttonsArea.clientHeight;


            const buttonWidth =
                noBtn.offsetWidth;


            const buttonHeight =
                noBtn.offsetHeight;


            const padding = 3;


            const maxX =
                Math.max(
                    1,
                    areaWidth -
                    buttonWidth -
                    padding
                );


            const maxY =
                Math.max(
                    1,
                    areaHeight -
                    buttonHeight -
                    padding
                );


            /*
             * نقطه تصادفی
             */

            const randomX =
                padding +
                Math.random() *
                maxX;


            const randomY =
                padding +
                Math.random() *
                maxY;


            /*
             * جابه‌جایی سریع
             */

            noBtn.style.left =
                randomX + "px";


            noBtn.style.top =
                randomY + "px";
        }



        /* ==========================
           وقتی موس نزدیک نه می‌شود
        ========================== */

        noBtn.addEventListener(
            "mouseenter",
            moveNo
        );



        /* ==========================
           جلوگیری از کلیک
        ========================== */

        noBtn.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveNo();

            }
        );



        /* ==========================
           موبایل
        ========================== */

        noBtn.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNo();

            },
            {
                passive: false
            }
        );



        /* ==========================
           حتی اگر موس خیلی نزدیک شود
        ========================== */

        document.addEventListener(
            "mousemove",
            function (event) {


                const rect =
                    noBtn.getBoundingClientRect();


                /*
                 * فاصله موس تا مرکز دکمه
                 */

                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        Math.pow(
                            event.clientX -
                            centerX,
                            2
                        )

                        +

                        Math.pow(
                            event.clientY -
                            centerY,
                            2
                        )

                    );


                /*
                 * اگر موس تا 80 پیکسل
                 * نزدیک شد، فرار کن
                 */

                if (distance < 80) {

                    moveNo();

                }

            }
        );



        /* ==========================
           رفتن به مرحله بعد
        ========================== */

        function goToStep(stepNumber) {


            document
                .getElementById("step0")
                .classList
                .add("hidden");


            document
                .getElementById("step1")
                .classList
                .add("hidden");


            document
                .getElementById("step2")
                .classList
                .add("hidden");


            document
                .getElementById("step3")
                .classList
                .add("hidden");


            const step =
                document.getElementById(
                    "step" +
                    stepNumber
                );


            step
                .classList
                .remove("hidden");


            step
                .classList
                .remove("fade-in");


            void step.offsetWidth;


            step
                .classList
                .add("fade-in");

        }



        /* ==========================
           انتخاب زمان
        ========================== */

        function chooseTime(time) {


            selectedTime = time;


            document
                .getElementById(
                    "selectedTime"
                )
                .textContent =
                selectedTime;


            goToStep(2);

        }



        /* ==========================
           انتخاب غذا
        ========================== */

        function chooseFood(food) {


            selectedFood = food;


            document
                .getElementById(
                    "selectedFood"
                )
                .textContent =
                selectedFood;


            goToStep(3);


            startHeartRain();

        }



        /* ==========================
           ساخت قلب
        ========================== */

        function createHeart() {


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            heart.textContent =
                "❤️";


            heart.style.left =
                Math.random() *
                100 +
                "vw";


            heart.style.fontSize =
                (
                    16 +
                    Math.random() *
                    25
                ) +
                "px";


            const duration =
                3 +
                Math.random() *
                4;


            heart.style.animationDuration =
                duration +
                "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function () {

                    heart.remove();

                },
                duration * 1000
            );

        }



        /* ==========================
           شروع بارش قلب
        ========================== */

        function startHeartRain() {


            if (heartsStarted) {

                return;

            }


            heartsStarted = true;


            /*
             * قلب‌های اول
             */

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                setTimeout(
                    createHeart,
                    i * 100
                );

            }


            /*
             * بارش ادامه‌دار
             */

            setInterval(
                createHeart,
                250
            );

        }


    </script>

</body>

</html>
